[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/XenithONE/xenith"
authors = ["XenithONE"]

[workspace.dependencies]
# Internal crates
xenith-diag = { path = "crates/xenith-diag" }
xenith-syntax = { path = "crates/xenith-syntax" }
xenith-sema = { path = "crates/xenith-sema" }
xenith-vm = { path = "crates/xenith-vm" }
xenith-driver = { path = "crates/xenith-driver" }

# External
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
insta = { version = "1", features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
