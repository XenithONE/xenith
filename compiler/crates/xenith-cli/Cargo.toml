[package]
name = "xenith"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The Xenith compiler"

[[bin]]
name = "xenith"
path = "src/main.rs"

[dependencies]
xenith-diag = { workspace = true }
xenith-syntax = { workspace = true }
xenith-sema = { workspace = true }
xenith-driver = { workspace = true }
xenith-vm = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The design/0013 §1 equivalence tests drive the MCP server in-process and
# compare its normalized diagnostics against this binary's JSON output —
# one truth, two surfaces, checked from the CLI side where the binary lives.
xenith-mcp = { path = "../../tools/xenith-mcp" }
